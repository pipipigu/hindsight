name: hindsight-agent-mcp
services:
  memory-mcp:
    image: local/hindsight-agent-mcp:remote
    container_name: hindsight-agent-mcp
    build:
      context: ../..
      dockerfile: deploy/remote/Dockerfile
    restart: unless-stopped
    init: true
    network_mode: bridge
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_HOST_PORT:-8787}:8787"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    mem_limit: 512m
    pids_limit: 100
